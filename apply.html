<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply for Survival Management Company Grant</title>
    <style>
        /* General Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            line-height: 1.6;
            background-color: #f5f5f5;
            color: #333;
        }

        /* Centered Container */
        .container {
            width: 80%;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 30px;
            color: #333;
        }

        /* Survey Form Styles */
        form {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 1.2rem;
            margin-bottom: 5px;
        }

        input, textarea {
            font-size: 1rem;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        textarea {
            resize: vertical;
        }

        button {
            padding: 10px 20px;
            background-color: #00ff95;
            color: #fff;
            font-size: 1.2rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #00cc7a;
        }

        /* Popup Form Styles */
        .popup {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
        }

        .popup-content {
            background-color: #fff;
            padding: 30px;
            border-radius: 10px;
            max-width: 500px;
            text-align: center;
        }

        .popup-content h2 {
            font-size: 2rem;
            color: #333;
            margin-bottom: 20px;
        }

        .popup-content p {
            font-size: 1.2rem;
            margin-bottom: 20px;
        }

        .popup-content input,
        .popup-content textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .popup-content button {
            background-color: #00ff95;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .popup-content button:hover {
            background-color: #00cc7a;
        }

        /* Close Button */
        .close-popup {
            background-color: red;
            color: white;
            padding: 5px 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Apply for Survival Management Company Grant</h1>

    <p>Fill out the survey below to be eligible for our $100 Grant. Upon successful submission, you'll be asked to complete your application.</p>

    <!-- Survey Form -->
    <form id="surveyForm">
        <label for="q1">1. How did you hear about Survival Management Company?</label>
        <input type="text" id="q1" required>

        <label for="q2">2. Why do you need the $100 Grant?</label>
        <textarea id="q2" required></textarea>

        <label for="q3">3. How will the $100 help you achieve your goals?</label>
        <textarea id="q3" required></textarea>

        <label for="q4">4. What is your current occupation?</label>
        <input type="text" id="q4" required>

        <label for="q5">5. What city and state are you located in?</label>
        <input type="text" id="q5" required>

        <label for="q6">6. How old are you?</label>
        <input type="number" id="q6" required>

        <button type="submit">Submit Survey</button>
    </form>
</div>

<!-- Popup for Personal Details -->
<div id="popup" class="popup">
    <div class="popup-content">
        <h2>You're eligible for our $100 Grant!</h2>
        <p>Please complete your application by entering your personal details below.</p>
        
        <label for="name">Full Name:</label>
        <input type="text" id="name" required>

        <label for="email">Email Address:</label>
        <input type="email" id="email" required>

        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" required>

        <label for="message">Your Message:</label>
        <textarea id="message" required></textarea>

        <button id="completeApplicationBtn">Complete Application</button>
        <button class="close-popup" onclick="closePopup()">Close</button>
    </div>
</div>

<script>
    // Handle form submission
    document.getElementById("surveyForm").addEventListener("submit", function(e) {
        e.preventDefault();
        
        // Show the popup for entering personal details
        document.getElementById("popup").style.display = "flex";
    });

    // Close the popup
    function closePopup() {
        document.getElementById("popup").style.display = "none";
    }

    // Handle the final application submission (open email)
    document.getElementById("completeApplicationBtn").addEventListener("click", function() {
        // Get the survey answers
        const q1 = document.getElementById("q1").value;
        const q2 = document.getElementById("q2").value;
        const q3 = document.getElementById("q3").value;
        const q4 = document.getElementById("q4").value;
        const q5 = document.getElementById("q5").value;
        const q6 = document.getElementById("q6").value;

        // Get the personal details
        const name = document.getElementById("name").value;
        const email = document.getElementById("email").value;
        const phone = document.getElementById("phone").value;
        const message = document.getElementById("message").value;

        // Construct the email body
        const emailBody = `
            Application for $100 Grant:

            Survey Answers:
            1. How did you hear about Survival Management Company?: ${q1}
            2. Why do you need the $100 Grant?: ${q2}
            3. How will the $100 help you achieve your goals?: ${q3}
            4. What is your current occupation?: ${q4}
            5. What city and state are you located in?: ${q5}
            6. How old are you?: ${q6}

            Personal Details:
            Name: ${name}
            Email: ${email}
            Phone: ${phone}
            Message: ${message}
        `;

        // Create a mailto link to open the email client with pre-filled details
        const mailtoLink = `mailto:support@survival-managementcompany.com?subject=Application for $100 Grant&body=${encodeURIComponent(emailBody)}`;

        // Open the default email client with the pre-filled email
        window.location.href = mailtoLink;

        // Close the popup
        closePopup();
    });
</script>

</body>
</html>
